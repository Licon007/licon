<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Painel · Big Designer</title>
<style>
:root{--bg:#15161d;--card:#1d1f29;--ink:#f2f1f5;--soft:#a7a9bf;--line:rgba(235,236,246,.18);--acc:#aab7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
[hidden]{display:none!important}button{font:inherit;color:inherit;cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:14px}
h1{font:800 22px 'Syne',system-ui,sans-serif;margin:0}
input,textarea,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:100px;resize:vertical}
.btn{padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:none}.pri{background:var(--acc);color:#101224;border:0;font-weight:700}
.top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px}
.top a{color:var(--soft)}.wrap{max-width:720px;margin:0 auto;padding:18px 18px 130px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px}.tabs button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;white-space:nowrap}.tabs .on{background:var(--acc);color:#101224;border-color:var(--acc);font-weight:700}
.fld{display:grid;gap:5px;font-size:13px;color:var(--soft);margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--card)}
.card h3{margin:0 0 10px;font-size:15px}.hint{font-size:14px;color:var(--soft);margin:0 0 14px}
.thumb{width:100%;max-height:170px;object-fit:contain;border-radius:10px;background:var(--bg);margin-bottom:10px}
.del{background:none;border:0;color:#ff6b70;padding:6px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.msg{font-size:14px;color:var(--soft)}
</style>
</head><body>
<div class="login" id="login" hidden><form class="box" id="lf"><h1>Ligar ao GitHub</h1>
<p class="hint">Só é preciso uma vez neste dispositivo. O token fica guardado apenas neste navegador.</p>
<label class="fld">Utilizador do GitHub<input id="ow" value="licon007" required></label>
<label class="fld">Repositório<input id="rp" value="licon007.github.io" required></label>
<label class="fld">Branch<input id="br" value="main" required></label>
<label class="fld">Token de acesso<input type="password" id="tk" autocomplete="off" required></label>
<button class="btn pri" type="submit">Ligar</button><div class="msg" id="lm" role="status"></div></form></div>
<div id="app" hidden>
<div class="top"><b>Painel de controlo</b><span><a href="../" target="_blank" rel="noopener">Ver site</a> · <button class="del" id="out" style="color:var(--soft)">Sair</button></span></div>
<div class="wrap"><div class="tabs" id="tabs"></div><div id="body"></div></div>
<div class="bar"><span class="msg" id="msg" role="status"></span><button class="btn pri" id="save">Guardar</button></div>
</div>
<script>
var CFG=null,D=null,sha='',tab='g',cur='',prev={};
try{CFG=JSON.parse(localStorage.getItem('bd_gh')||'null')}catch(e){}
var $=function(s){return document.querySelector(s)};
function show(id){$('#login').hidden=id!=='login';$('#app').hidden=id!=='app'}
function msg(t){$('#msg').textContent=t}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
async function gh(path,opt){opt=opt||{};
opt.headers=Object.assign({'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.headers||{});
var url='https://api.github.com/repos/'+encodeURIComponent(CFG.owner)+'/'+encodeURIComponent(CFG.repo)+'/contents/'+path+(opt.method?'':'?ref='+encodeURIComponent(CFG.branch));
var r=await fetch(url,opt),j=await r.json().catch(function(){return{}});
if(!r.ok){var e=new Error(r.status===401?'Token inválido ou expirado.':r.status===404?'Não encontrei o repositório ou ficheiro (confirma o nome e as permissões do token).':r.status===409||r.status===422?'Conflito: o ficheiro mudou noutro sítio. Recarrega a página.':r.status===403?'Sem permissão. O token precisa de "Contents: Read and write".':(j.message||'Erro '+r.status));e.status=r.status;throw e}return j}
async function load(){
try{var j=await gh('content.json');sha=j.sha;D=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}
catch(e){if(e.status!==404)throw e;sha='';D=await (await fetch('../content.json?v='+Date.now())).json()}
D.img=D.img||{};D.txt=D.txt||{};D.pj=D.pj||{};D.sk=D.sk||[];cur=Object.keys(D.pj)[0]||'';show('app');draw()}
if(CFG&&CFG.token){load().catch(function(e){show('login');$('#lm').textContent=e.message})}else show('login');
$('#lf').onsubmit=async function(e){e.preventDefault();$('#lm').textContent='A ligar…';
CFG={owner:$('#ow').value.trim(),repo:$('#rp').value.trim(),branch:$('#br').value.trim(),token:$('#tk').value.trim()};
try{await load();localStorage.setItem('bd_gh',JSON.stringify(CFG));$('#tk').value=''}catch(x){$('#lm').textContent=x.message}};
$('#out').onclick=function(){localStorage.removeItem('bd_gh');location.reload()};
$('#save').onclick=async function(){msg('A guardar no GitHub…');
try{var body={message:'Actualizar conteúdo pelo painel',content:b64(JSON.stringify(D,null,1)),branch:CFG.branch};if(sha)body.sha=sha;
var j=await gh('content.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});sha=j.content.sha;
msg('Guardado. O site actualiza dentro de 1 a 2 minutos.')}catch(e){msg(e.message)}};
function field(l,v,fn,area,type){var w=document.createElement('label');w.className='fld';w.textContent=l;var i=document.createElement(area?'textarea':'input');if(type)i.type=type;i.value=v==null?'':v;i.oninput=function(){fn(i.value)};w.appendChild(i);return w}
function btn(t,fn,c){var b=document.createElement('button');b.type='button';b.textContent=t;b.className=c||'btn';b.onclick=fn;return b}
function hint(t){var p=document.createElement('p');p.className='hint';p.textContent=t;return p}
function draw(){
var tb=$('#tabs');tb.innerHTML='';[['g','Textos'],['h','Habilidades'],['p','Projectos'],['f','Fotos']].forEach(function(t){tb.appendChild(btn(t[1],function(){tab=t[0];draw()},t[0]===tab?'on':''))});
var b=$('#body');b.innerHTML='';
if(tab==='g'){b.appendChild(hint('Na frase de abertura, escreve *palavra* para a sublinhar.'));
Object.keys(D.txt).forEach(function(k){b.appendChild(field(k,D.txt[k],function(v){D.txt[k]=v},D.txt[k].length>50))});
b.appendChild(field('Número de WhatsApp (só dígitos, com 258)',D.wa,function(v){D.wa=v.replace(/\D/g,'')}))}
if(tab==='h'){D.sk.forEach(function(s,i){var c=document.createElement('div');c.className='card';
c.appendChild(field('Nome',s[0],function(v){s[0]=v}));c.appendChild(field('Rótulo',s[1],function(v){s[1]=v}));
c.appendChild(field('Nível (0 a 100)',s[2],function(v){s[2]=Math.max(0,Math.min(100,+v||0))},false,'number'));
var l=document.createElement('label');var k=document.createElement('input');k.type='checkbox';k.style.width='auto';k.checked=s[3]==='learn';k.onchange=function(){s[3]=k.checked?'learn':''};l.appendChild(k);l.append(' A aprender (barra tracejada)');c.appendChild(l);
c.appendChild(document.createElement('br'));c.appendChild(btn('Remover',function(){D.sk.splice(i,1);draw()},'del'));b.appendChild(c)});
b.appendChild(btn('+ Nova habilidade',function(){D.sk.push(['Nova','',50,'']);draw()}))}
if(tab==='p'){var sel=document.createElement('select');Object.keys(D.pj).forEach(function(id){var o=document.createElement('option');o.value=id;o.textContent=D.pj[id].t;if(id===cur)o.selected=true;sel.appendChild(o)});sel.onchange=function(){cur=sel.value;draw()};sel.style.marginBottom='16px';b.appendChild(sel);
var p=D.pj[cur];[['t','Título'],['c','Categoria'],['b','Frase curta na lista'],['d','Descrição'],['o','Objectivo'],['a','Abordagem'],['r','Resultado']].forEach(function(f){b.appendChild(field(f[1],p[f[0]],function(v){p[f[0]]=v},f[0]!=='t'&&f[0]!=='c'))})}
if(tab==='f'){b.appendChild(hint('Aceita jpg, png, webp, gif, mp4, webm e modelos 3D .glb (até 25 MB). Para o 3D, converte o teu .fbx para .glb e deixa-o leve (menos de 10 MB).'));
var slots=[['hero','Topo do site: foto de corpo inteiro (PNG com fundo transparente) ou vídeo 3D']];
Object.keys(D.pj).forEach(function(id){['Imagem principal','Detalhe 1','Detalhe 2','Detalhe 3','Detalhe 4'].forEach(function(n,i){slots.push(['p:projeto-'+id+':'+i,D.pj[id].t+' · '+n])})});
slots.forEach(function(s){var c=document.createElement('div');c.className='card';var h=document.createElement('h3');h.textContent=s[1];c.appendChild(h);var o=D.img[s[0]];
if(o&&o.m===1){var q=document.createElement('p');q.className='hint';q.textContent='Modelo 3D activo: '+o.u;c.appendChild(q)}else if(o){var el=document.createElement(o.m===2?'video':'img');el.src=prev[s[0]]||'../'+o.u;el.className='thumb';if(o.m===2){el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true}else el.alt='';c.appendChild(el)}
var f=document.createElement('input');f.type='file';f.accept='image/*,video/mp4,video/webm,.glb';f.onchange=function(){if(f.files[0])up(s[0],f.files[0])};c.appendChild(f);
if(o)c.appendChild(btn('Remover',function(){delete D.img[s[0]];draw()},'del'));b.appendChild(c)})}}
async function up(key,file){
if(file.size>20*1024*1024){msg('Ficheiro acima de 20 MB.');return}
var ext=(file.name.split('.').pop()||'').toLowerCase(),vid=['mp4','webm'].indexOf(ext)>-1,glb=ext==='glb';
if(['jpg','jpeg','png','webp','gif','mp4','webm','glb'].indexOf(ext)<0){msg('Formato não permitido (jpg, png, webp, gif, mp4 ou webm).');return}
msg('A enviar para o GitHub…');
try{var data=await new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=no;r.readAsDataURL(file)});
var name=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(function(x){return x.toString(16).padStart(2,'0')}).join('')+'.'+ext;
await gh('uploads/'+name,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Adicionar ficheiro pelo painel',content:data.split(',')[1],branch:CFG.branch})});
D.img[key]={u:'uploads/'+name,m:vid?2:glb?1:0};if(!glb)prev[key]=data;msg('Enviado. Carrega em Guardar para o mostrar no site.');draw()}catch(e){msg(e.message)}}
</script></body></html>
